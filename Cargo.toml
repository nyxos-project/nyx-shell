[workspace]
resolver = "3"
members = ["crates/nyx-shell-proto", "crates/nyx-shell-core", "apps/shell-core", "apps/shellctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/nyxos-project/nyx-shell"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
notify = { version = "8", default-features = false }
libc = "0.2"
tempfile = "3"
# Shared Nyx crates, pinned like every Nyx repository. nyx-desktop without its `glib`
# feature is plain std: the model, watcher and dispatchers.
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "32f0c5e154fc44c763b8ecd80d35a3b298723afa", default-features = false }
nyx-peer = { git = "https://github.com/design-nexus/nyx-core.git", rev = "32f0c5e154fc44c763b8ecd80d35a3b298723afa" }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "f68ecc891cd0d5a36b6ed29e93ed5ffc52e77acc" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "4f8e16d6ae3dbc2a14091271e3b6bb29902c0df4" }

[profile.release]
lto = "thin"
strip = true
