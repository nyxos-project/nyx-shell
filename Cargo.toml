[workspace]
resolver = "3"
members = ["crates/nyx-shell-proto", "crates/nyx-shell-core", "apps/shell-core", "apps/shellctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/nyxos-project/nyx-shell"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
notify = { version = "8", default-features = false }
libc = "0.2"
tempfile = "3"
# Shared Nyx crates, pinned like every Nyx repository. nyx-desktop without its `glib`
# feature is plain std: the model, watcher and dispatchers.
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a93881d696abb6e9176675d5c84374b9bd124167", default-features = false }
nyx-peer = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a93881d696abb6e9176675d5c84374b9bd124167" }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "87461e53c2fc5fb5e045204e2a492c32c86a3f26" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }

[profile.release]
lto = "thin"
strip = true
