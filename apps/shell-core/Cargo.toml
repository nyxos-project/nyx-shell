[package]
name = "nyx-shell-core-bin"
description = "nyx-shell-core: the Nyx shell's coordinator daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-shell-core"
path = "src/main.rs"

[features]
default = ["palette"]
palette = ["nyx-shell-core/palette"]

[dependencies]
nyx-shell-core = { path = "../../crates/nyx-shell-core", default-features = false }
nyx-shell-proto = { path = "../../crates/nyx-shell-proto" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
